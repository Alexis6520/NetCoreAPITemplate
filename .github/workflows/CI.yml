name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  dotnetver: 10.0.x
  unit_test_dir: UnitTests
  integration_test_dir: IntegrationTests
  artifact_dir: artifacts
  tar_file: test_files.tar

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.dotnetver}}
          cache: true
          cache-dependency-path: |
            src/Host/packages.lock.json
            src/Persistence/packages.lock.json
            IntegrationTests/packages.lock.json
            UnitTests/packages.lock.json
      - name: Restore dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: |
          dotnet build UnitTests -c Release --no-restore --output ${{env.artifact_dir}}/${{env.unit_test_dir}}
          dotnet build IntegrationTests -c Release --no-restore --output ${{env.artifact_dir}}/${{env.integration_test_dir}}
      - name: "Tar files"
        run: tar -cvf ${{env.tar_file}} ${{env.artifact_dir}}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          path: ${{env.tar_file}}
          archive: false

  unit-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.dotnetver}}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{env.tar_file}}
      - name: Untar files
        run: tar -xvf ${{env.tar_file}}
      - name: Run tests
        run: dotnet test ${{env.artifact_dir}}/${{env.unit_test_dir}}/UnitTests.dll

  integration-test:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: krispy
          POSTGRES_PASSWORD: kreme
          POSTGRES_DB: krispy_kreme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{env.dotnetver}}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{env.tar_file}}
      - name: Untar files
        run: tar -xvf ${{env.tar_file}}
      - name: Run tests
        run: dotnet test ${{env.artifact_dir}}/${{env.integration_test_dir}}/IntegrationTests.dll
