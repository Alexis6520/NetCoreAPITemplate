name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  dotnetver: 10.0.x
  unit_test_dir: UnitTests/bin/Release/net10.0
  integration_test_dir: IntegrationTests/bin/Release/net10.0
  tar_file: test_files.tar

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{env.dotnetver}}
    - name: Build
      run: dotnet build -c Release
    - name: 'Tar files'
      run: tar -cvf ${{env.tar_file}} ${{env.unit_test_dir}} ${{env.integration_test_dir}}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        retention-days: 3
        path: ${{env.tar_file}}
        archive: false

  unit-test:

    runs-on: ubuntu-latest   
    needs: build

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.dotnetver}}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{env.tar_file}}
      - name: Untar files
        run: tar -xvf ${{env.tar_file}}
      - name: Run tests
        run: dotnet test ${{env.unit_test_dir}}/UnitTests.dll
        
  integration-test:

    runs-on: ubuntu-latest   
    needs: build

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: krispy
          POSTGRES_PASSWORD: kreme
          POSTGRES_DB: krispy_kreme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{env.dotnetver}}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{env.tar_file}}
      - name: Untar files
        run: tar -xvf ${{env.tar_file}}
      - name: Run tests
        run: dotnet test ${{env.integration_test_dir}}/IntegrationTests.dll
