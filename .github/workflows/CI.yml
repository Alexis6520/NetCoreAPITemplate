name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: tests-artifacts
        path: |
          ./UnitTests/bin/net10.0/
          ./IntegrationTests/bin/net10.0/
